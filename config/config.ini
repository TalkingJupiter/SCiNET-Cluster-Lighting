; Each rack lists its sides on its controller's strip:
;   side-x = first pixel (0-based), pixel count, up|down
; Pixels no side claims stay dark (e.g. the run over the top of an uncut strip).
; Racks that share a controller share its pixel space, so the second rack's
; sides start after the first's. Two racks on one controller, strips cut:
;
;   [Rack1]                       [Rack2]
;   led-ip = 10.10.1.1            led-ip = 10.10.1.1
;   side-a = 0, 113, up           side-a = 226, 113, up
;   side-b = 113, 113, down       side-b = 339, 113, down
;
; PLACEHOLDER: one rack per controller until the wiring is decided.

[Rack1]
led-ip = 10.10.1.1
redfish-ips = 10.11.11.1, 10.11.11.2
side-a = 0, 113, up
side-b = 113, 113, down

[Rack2]
led-ip = 10.10.2.1
redfish-ips = 10.11.12.1, 10.11.12.2
side-a = 0, 113, up
side-b = 113, 113, down

