[Led-Controller]
; chase: WLED chase when idle, highlight on request
; meter: kW meter from the power readings DevOps pushes; racks with no
;        reading blink red, so switch only once DevOps is sending
mode = chase
connection-type = continues
; WLED segment slots per controller. 16 is the ESP8266 limit.
max-segments = 16
# most likely just going to be 6 segments at most - low rack - left, top, right; 
# high rack - left, top, right. current configuration is just low rack, high rack.
# not sure segmenting is really necessary? does it make WLED API any easier?
; Budget per rack, so one rack's highlight can never take the other rack's
; segments. 2 racks x 8 = 16. With 2 sides, a rack can highlight up to 4
; separate groups of U's (1,2 is one group; 1,5 is two).
segments-per-rack = 8

[Units]
; Rack units per rack. They're spread evenly over each side's length.
u-count = 42

[Idle]
effect = Chase
color = 255, 120, 0
speed = 160
intensity = 128
brightness = 255


# probably breathe, then go solid and wait a while before reseting
# or reset via command from kiosk
[Highlight]
effect = Breathe
color = 255, 255, 255
brightness = 150
; 0-255, 128 is WLED's default. 200 is a medium-fast breathe.
speed = 200
; The rack returns to idle on its own after this long. A new highlight on
; the same rack replaces the old one and restarts the timer.
hold-seconds = 5

[Energy]
min-kw = 0
max-kw = 50
amber-from-kw = 30
red-from-kw = 40
stale-after-seconds = 30

[Meter]
brightness=200
green = 0, 200, 0
amber = 255, 140, 0
red = 255, 0, 0
no-data-effect = Blink