; LED layout
; ----------
; Each rack has one uncut strip of 301 LEDs: up side A, across the top of the
; rack, and down side B. Each side is listed as
;
;   side-x = first pixel, length, up|down
;
;   first pixel  0-based, counted along the controller's whole LED line
;   length       how many pixels run along that side (the rack's height),
;                113 here; 42U of the 3-3-2 pattern use 112, the top one is spare
;   up | down    which end of the side its first pixel is at
;
; The run across the top (the rack's width) is not a side: those pixels belong
; to no side and stay dark. One 301-LED strip, in WLED's 0-based numbering:
;
;   pixel    0       first LED, skipped (as in the calibrated prototype)
;   pixels   1-113   side A, up      (U1 = 1-3, U42 = 111-112, 113 spare)
;   pixels 114-187   across the top  (74 dark)
;   pixels 188-300   side B, down    (U42 = 189-190, U1 = 298-300, 188 spare)
;
; Two racks share each controller, one strip per WLED output. WLED numbers
; output 2 after output 1, so the second rack's strip starts at pixel 301
; (its first LED is skipped too, so its side A starts at 302): set
; output 2's start to 301 in WLED's LED Preferences.
;
; From the prototype's measurements; confirm the strip length and the dark
; section on the mounted hardware.

# add a "top" for the ones across the top of racks for chase effects perhaps?
[Rack1]
led-ip = 140.221.240.5
side-a = 1, 113, up
side-b = 188, 113, down

