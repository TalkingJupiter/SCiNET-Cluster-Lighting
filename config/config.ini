; LED layout
; ----------
; Each rack has one uncut strip of 259 LEDs: up side A, across the top of the
; rack, and down side B. Each side is listed as
;
;   side-x = first pixel, length, up|down
;
;   first pixel  0-based, counted along the controller's whole LED line
;   length       the LEDs alongside the rack units, from the bottom of U1 to
;                the top of U42: 109 here. The 42 U's are spread evenly over
;                them (3 or 2 LEDs each); every side of a rack must have the
;                same length.
;   up | down    which end of the side its first pixel is at
;
; The run across the top (the rack's width) is not a side: those pixels belong
; to no side and stay dark. One 259-LED strip, in WLED's 0-based numbering:
;
;   pixel    0       first LED, hidden; never lights
;   pixels   1-109   side A, up      (U1 = 1-3, U42 = 107-109)
;   pixels 110-149   across the top  (40 dark)
;   pixels 150-258   side B, down    (U42 = 150-152, U1 = 256-258)
;
; Two racks share each controller, one strip per WLED output. WLED numbers
; output 2 after output 1, so the second rack's strip starts at pixel 259
; (its side A at 260). In WLED's LED Preferences set output 1 to start 0,
; length 259, and output 2 to start 259, length 259 (518 in total). A DNOC
; controller has one strip: 259.
;
; Measured on Rack5 (140.221.240.7) on 2026-11-11. Check U1 and U42 on one
; rack per controller.

# add a "top" for the ones across the top of racks for chase effects perhaps?
